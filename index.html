<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ORBITAL PILOT // VERCEL</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-wrapper">
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        
        <div id="score-container" class="hud">
            <div class="label">ALTITUDE</div>
            <div id="score">0</div>
        </div>

        <div id="combo-ui" class="hud">STREAK: 0</div>

        <div id="vision-container">
            <div class="vision-track">
                <div id="vision-bar"></div>
            </div>
        </div>

<div id="login-screen" class="ui-card">
    <h1 style="letter-spacing: 10px;">PILOT LOGIN</h1>
    
    <input type="text" id="username-input" placeholder="ENTER CALLSIGN..." maxlength="12">
    
    <div class="label" style="margin-top: 20px;">SELECT HULL NEON</div>
    <div id="skin-selector">
        <div class="skin-opt active" data-color="#00f2ff" style="background: #00f2ff;"></div>
        <div class="skin-opt" data-color="#ff00ff" style="background: #ff00ff;"></div>
        <div class="skin-opt" data-color="#33ff00" style="background: #33ff00;"></div>
        <div class="skin-opt" data-color="#ffff00" style="background: #ffff00;"></div>
    </div>

    <button onclick="confirmPilot()" style="margin-top: 30px;">INITIALIZE LINK</button>
</div>

            <div id="main-menu" class="ui-card">
                <button onclick="startGame()">SOLO DEPLOYMENT</button>
                <button onclick="handleBoost()" style="border-color: #ffcc00; color: #ffcc00; margin-top: 15px;">
                    BOOST START (+500)
                </button>
            </div>

            <div id="game-over-card" class="ui-card">
                <h2 style="color: #ff4444; letter-spacing: 5px; margin-bottom: 10px;">LINK SEVERED</h2>
                <div class="label">FINAL ALTITUDE</div>
                <div id="final-score-display" style="font-size: 50px; font-weight: 900; margin-bottom: 20px;">0</div>
                <button onclick="startGame()">RE-ESTABLISH LINK</button>
            </div>
        </div>
    </div>

    <audio id="bgMusic" loop preload="auto">
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>
</html>
