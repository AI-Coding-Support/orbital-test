<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=600">
    <title>Orbit Racer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="game-wrapper">
            <canvas id="gameCanvas" width="600" height="600"></canvas>
            
            <div id="ui-layer">
                <div id="score-container" class="hud">
                    <div class="label">ALTITUDE</div>
                    <div id="score">0</div>
                </div>
                
                <div id="combo-ui" class="hud">STREAK: 0</div>
                
                <div id="vision-container" class="hud">
                    <div class="label">VISIBILITY</div>
                    <div class="vision-track"><div id="vision-bar"></div></div>
                </div>

                <div id="welcome-screen" class="ui-card">
                    <h1>ORBIT</h1>
                    <p>Synchronize your engine with the orbital gates.</p>
                    <button onclick="registerPilot()">INITIALIZE</button>
                </div>

                <div id="main-menu" class="ui-card">
                    <h1>READY?</h1>
                    <button onclick="startGame()">MANUAL START</button>
                    <button onclick="handleBoost()" style="margin-top: 10px; border-color: #ffcc00; color: #ffcc00;">BOOST START (+100)</button>
                </div>

                <div id="game-over-card" class="ui-card">
                    <h1>SIGNAL LOST</h1>
                    <p>Final Altitude: <span id="final-score-display">0</span>m</p>
                    <button onclick="startGame()">REBOOT</button>
                </div>
            </div>
        </div>
    </div>
    <audio id="bgMusic" loop src="your-music-file.mp3"></audio>
    <script src="script.js"></script>
</body>
</html>
